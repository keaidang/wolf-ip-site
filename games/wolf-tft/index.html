        <li>E：买经验</li>
        <li>空格：×1 / ×2 加速</li>
        <li>Esc：关闭弹窗</li>
      </ul></div>
    </div>
    <div class="center" style="margin-top:14px"><button class="btn" id="btnCloseHelp">知道了</button></div>
  `);
  $('btnCloseHelp').onclick = closeModal;
}

/* ---------- 同步 ---------- */
function sync(){
  renderTop(); renderShop(); renderBench(); renderTraits(); renderItems(); renderFoe();
  const pb = $('phaseBtn');
  if (G.phase === 'battle'){ pb.textContent = '战斗中…'; pb.disabled = true; pb.classList.remove('ready'); $('phaseTag').textContent = '战斗阶段'; }
  else { pb.disabled = false; pb.classList.add('ready'); pb.textContent = '开始战斗'; $('phaseTag').textContent = '准备阶段'; }
  $('btnRefresh').disabled = G.phase !== 'prep';
  $('btnExp').disabled = G.phase !== 'prep';
  const aug = G.augs[G.augs.length - 1];
  $('augName').textContent = aug ? aug.name : '';
  $('augDesc').textContent = aug ? aug.desc : '';
  $('augEmpty').style.display = aug ? 'none' : '';
  if (G.phase === 'aug') augModal();
  if (G.phase === 'over') resultModal();
}

/* ---------- boot ---------- */
function boot(){
  if (ICON_URI){ $('brandIcon').src = ICON_URI; $('coachImg').src = ICON_URI; }
  layout();
  window.addEventListener('resize', () => { layout(); });
  $('btnHelp').onclick = helpModal;
  $('phaseBtn').onclick = onPhaseBtn;
  $('btnRefresh').onclick = () => { const r = refreshShop(); if (r.ok) AudioFX.click(); else toast(r.msg); sync(); };
  $('btnExp').onclick = () => { const r = buyExp(); if (r.ok) AudioFX.coin(); else toast(r.msg); sync(); };
  $('speedTag').onclick = () => { ui.speed = ui.speed === 1 ? 2 : 1; $('speedTag').textContent = '×' + ui.speed; };
  $('modal').addEventListener('click', e => { if (e.target.id === 'modal' && G.phase !== 'aug' && G.phase !== 'over') closeModal(); });
  document.addEventListener('keydown', onKey);
  /* 截图钩子 */
  window.__go = goState;
  function hashRoute(){
    const h = (location.hash || '').replace('#', '');
    if (['prep', 'battle', 'aug', 'over', 'menu'].includes(h)){
      if (G.phase === 'menu') newGame();
      goState(h);
    }
  }
  window.addEventListener('hashchange', hashRoute);
  if (location.hash) hashRoute();
  else menuModal();
}

function onPhaseBtn(){
  if (G.phase === 'prep'){
    const r = startBattle();
    if (!r.ok){ toast(r.msg); return; }
    sync();
    AudioFX.place();
    banner('比赛开始', `第 ${G.stage} 回合`, `对手 ${G.foeName} · ${G.foeDesc}`);
    coachSay(pick(['守住防线！','压上进攻！','好戏开场！','让他们见识见识！']));
  } else if (G.phase === 'battle'){
    /* 跳过战斗 */
    if (G.bt){ G.bt.t = 999; }
  }
}

function onKey(e){
  if ($('modal').classList.contains('on')){
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' || e.key === ' '){ const b = $('sheet').querySelector('.btn'); if (b) b.click(); }
    return;
  }
  if (e.key === 'd' || e.key === 'D'){ onPhaseBtn(); }
  else if (e.key === 'f' || e.key === 'F'){ const r = refreshShop(); if (!r.ok) toast(r.msg); sync(); }
  else if (e.key === 'e' || e.key === 'E'){ const r = buyExp(); if (!r.ok) toast(r.msg); sync(); }
  else if (e.key === ' '){ e.preventDefault(); $('speedTag').click(); }
  else if (e.key === 'Escape'){ $('btnHelp').click(); }
}

/* 供截图/测试切换状态 */
function goState(s){
  if (s === 'prep'){
    G.phase = 'prep';
    sync();
  } else if (s === 'battle'){
    G.stage = 6;
    genFoe();
    G.board.length = 0;
    const lim = popLimit();
    G.bench.slice(0, lim).forEach((c, i) => placeCard(c.uid, i % 3, Math.floor(i / 3)));
    /* 补充到 5 人 */
    const pool = UNITS.filter(u => u.cost <= 3);
    for (let i = G.board.length; i < 5; i++){
      const def = pick(pool);
      const c = cardNew(def.id);
      G.bench.push(c);
      placeCard(c.uid, i % 3, Math.floor(i / 3));
    }
    /* 装配装备让画面丰富 */
    const keys = Object.keys(BASE_ITEMS);
    G.items = {'A+B': 1, 'C+D': 1, 'E': 1, 'F': 1, 'G': 1, 'H': 1};
    G.board.slice(0, 3).forEach((c, i) => {
      c.items.length = 0;
      c.items.push(i === 0 ? 'A+B' : i === 1 ? 'C+D' : pick(keys));
    });
    G.gold = 37;
    startBattle(); sync();
    banner('比赛开始', `第 ${G.stage} 回合`, `对手 ${G.foeName} · ${G.foeDesc}`);
  } else if (s === 'aug'){
    rollAugs(); sync();
  } else if (s === 'over'){
    G.result = {win:true, champion:true, dmg:0, inc:14, loot:['倒挂金钩','彩虹过人'], merged:[]};
    G.phase = 'over'; sync();
  } else if (s === 'menu'){
    G.phase = 'menu'; menuModal();
  }
}

/* ============================================================
   拖拽（pointer events：鼠标 + 触摸统一）
   ============================================================ */
function canvasOf(){ return $('arena'); }
function evPos(e){
  const r = canvasOf().getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top, r};
}
function pointToHex(px, py){
  for (let row = 0; row < ROWS; row++){
    for (let col = 0; col < COLS; col++){
      const p = hexPos(col, row, G.cell);
      if (Math.hypot(px - p.x, py - p.y) < G.cell * .58) return {col, row};
    }
  }
  return null;
}
function makeGhost(html){
  const g = document.createElement('div');
  g.id = 'ghost';
  g.style.cssText = 'position:fixed;z-index:60;pointer-events:none;width:54px;height:54px;opacity:.9;filter:drop-shadow(0 4px 8px #0005);transform:translate(-50%,-50%) scale(1.1)';
  g.innerHTML = html;
  document.body.appendChild(g);
  return g;
}
function ghostHTMLFromEl(el){
  const c = el.cloneNode(true);
  c.style.cssText = 'width:54px;height:54px;margin:0';
  return c.outerHTML;
}
function startDrag(e, data){
  if (ui.drag) return;
  const d = Object.assign({moved:false, sx:e.clientX, sy:e.clientY, px:e.clientX, py:e.clientY}, data);
  d.ghost = makeGhost(data.ghostHTML || '');
  d.ghost.style.display = 'none';
  ui.drag = d;
  /* 指针捕获：触摸拖动时不被滚动/其他元素吞掉事件 */
  if (e.pointerId != null && e.target.setPointerCapture){
    try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
  }
}
document.addEventListener('pointermove', e => {
  const d = ui.drag;
  if (!d) return;
  d.px = e.clientX; d.py = e.clientY;
  if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8){
    d.moved = true;
    d.ghost.style.display = '';
    if (d.onMoveStart) d.onMoveStart();
  }
  if (d.moved){
    d.ghost.style.left = e.clientX + 'px';
    d.ghost.style.top = e.clientY + 'px';
    const p = evPos(e);
    if (p.x >= 0 && p.y >= 0 && p.x <= p.r.width && p.y <= p.r.height){
      d.hover = pointToHex(p.x, p.y);
    } else d.hover = null;
  }
}, {passive:true});
document.addEventListener('pointerup', e => {
  const d = ui.drag;
  if (!d) return;
  ui.drag = null;
  d.ghost.remove();
  if (!d.moved){ if (d.onTap) d.onTap(e); return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const hexEl = el && el.closest ? el.closest('.hex') : null;
  const itemEl = el && el.closest ? el.closest('.itemCell') : null;
  const p = evPos(e);
  const inCanvas = el === canvasOf();
  if (d.kind === 'item'){
    if (hexEl){ attachItemDrop(d.key, hexEl.dataset.uid); AudioFX.place(); }
    else if (itemEl && itemEl.dataset.key){ mergeDrop(d.key, itemEl.dataset.key); if (!G.items[d.key]) AudioFX.star(); }
    sync();
    return;
  }
  /* 卡片拖拽 */
  if (inCanvas){
    const hex = pointToHex(p.x, p.y);
    if (hex && hex.col < COLS / 2){
      if (d.kind === 'shop'){
        const r = buyShop(d.idx);
        if (!r.ok) toast(r.msg);
        else {
          if (r.card && !G.bench.includes(r.card)) G.bench.push(r.card);
          const pr = placeCard(r.card.uid, hex.col, hex.row);
          if (!pr.ok && pr.msg) toast(pr.msg);
          else {
            AudioFX.place();
            const hp = hexPos(hex.col, hex.row, G.cell);
            addFx({type:'ring', x:hp.x, y:hp.y, r:G.cell * .8, color:'#ffe27a', life:.5});
            if (r.merged && r.merged.length){
              AudioFX.star();
              banner('合成成功', `${r.merged[0].star} 星 ${U_BY_ID[r.merged[0].id].name}`, '属性大幅提升');
            }
          }
        }
      } else if (d.kind === 'bench'){
        const pr = placeCard(d.uid, hex.col, hex.row);
        if (!pr.ok && pr.msg) toast(pr.msg);
        else {
          AudioFX.place();
          const hp = hexPos(hex.col, hex.row, G.cell);
          addFx({type:'ring', x:hp.x, y:hp.y, r:G.cell * .8, color:'#ffe27a', life:.5});
        }
      } else if (d.kind === 'board'){
        if (d.uid != null){
          const src = G.board.find(c => c.uid === d.uid);
          const occ = G.board.find(c => c.col === hex.col && c.row === hex.row && c.uid !== d.uid);
          if (src && occ){
            /* 目标格被队友占用：交换位置 */
            const tc = occ.col, tr = occ.row;
            occ.col = src.col; occ.row = src.row;
            src.col = tc; src.row = tr;
            AudioFX.click();
          } else {
            const pr = placeCard(d.uid, hex.col, hex.row);
            if (!pr.ok && pr.msg) toast(pr.msg);
            else AudioFX.click();
          }
        }
      }
      sync();
    } else if (hex && d.kind === 'board' && d.uid != null){
      /* 拖到对方半场：无效 */
      toast('只能布置在自家半场');
    }
    return;
  }
  /* 拖到备战区：下场 */
  if (d.kind === 'board' && d.uid != null && $('board').contains(el)){
    const r = benchCard(d.uid);
    if (!r.ok && r.msg) toast(r.msg);
    sync();
  }
});
document.addEventListener('pointercancel', () => {
  if (ui.drag){ ui.drag.ghost.remove(); ui.drag = null; }
});

function attachItemDrop(key, uid){
  const r = attachItem(key, +uid);
  if (!r.ok) toast(r.msg);
  else toast(`已装配 ${itemName(key)}`);
}
function mergeDrop(k1, k2){
  const r = tryMergeItems(k1, k2);
  if (!r.ok) toast(r.msg);
  else { toast(`合成大件：${BIG_ITEMS[r.big].name}！`); AudioFX.star(); }
}

/* 卡片/装备交互绑定（事件委托） */
function bindCardEvents(){
  $('board').addEventListener('pointerdown', e => {
    const hex = e.target.closest('.hex');
    if (!hex || G.phase !== 'prep') return;
    const uid = +hex.dataset.uid;
    startDrag(e, {
      kind:'bench', uid, ghostHTML:ghostHTMLFromEl(hex),
      onTap:ev => { /* 点击显示信息 */ showUnitTip(uid, ev.clientX, ev.clientY); },
    });
    holdToSell(e, uid);
  });
  $('shopList').addEventListener('pointerdown', e => {
    const item = e.target.closest('.shopItem');
    if (!item || G.phase !== 'prep') return;
    const idx = +item.dataset.idx;
    const c = G.shop[idx];
    if (!c || c.bought) return;
    const def = U_BY_ID[c.id];
    const hex = hexEl({id:c.id, star:1, items:[]}, '');
    startDrag(e, {
      kind:'shop', idx, ghostHTML:ghostHTMLFromEl(hex),
      onTap:() => { const r = buyShop(idx); if (!r.ok) toast(r.msg); else { if (r.merged && r.merged.length) toast(`合成 ${r.merged[0].star} 星 ${U_BY_ID[r.merged[0].id].name}！`); sync(); } },
    });
  });
  $('itemGrid').addEventListener('pointerdown', e => {
    const cell = e.target.closest('.itemCell');
    if (!cell || !cell.dataset.key) return;
    const key = cell.dataset.key;
    const it = isBig(key) ? BIG_ITEMS[key] : BASE_ITEMS[key];
    startDrag(e, {
      kind:'item', key, ghostHTML:`<div style="width:100%;height:100%;border-radius:10px;background:#fff;border:2px solid #e0952a;display:flex;align-items:center;justify-content:center;font-size:26px">${it.ic}</div>`,
      onTap:ev => showItemTip(key, ev.clientX, ev.clientY),
    });
  });
  /* 战场 Canvas：拾取场上球星（移动位置 / 拖回备战区） */
  $('arena').addEventListener('pointerdown', e => {
    if (G.phase !== 'prep') return;
    const p = evPos(e);
    const hex = pointToHex(p.x, p.y);
    if (!hex || hex.col >= COLS / 2) return;
    const card = G.board.find(c => c.col === hex.col && c.row === hex.row);
    if (!card) return;
    startDrag(e, {
      kind:'board', uid:card.uid, ghostHTML:ghostHTMLFromEl(hexEl(card, '')),
      onTap:ev => showUnitTip(card.uid, ev.clientX, ev.clientY),
    });
  });
  /* 右键出售 */
  document.addEventListener('contextmenu', e => {
    const hex = e.target.closest && e.target.closest('.hex');
    if (hex && $('board').contains(hex)){
      e.preventDefault();
      const r = sellCard(+hex.dataset.uid);
      if (r.ok){ toast(`出售返还 ${r.gold} 金`); AudioFX.coin(); }
      sync();
    }
  });
}
let holdT = 0;
function holdToSell(e, uid){
  clearTimeout(holdT);
  holdT = setTimeout(() => {
    /* 仅当指针仍未抬起、且未发生拖动时才出售（真·长按出售）；
       点击/拖拽后 ui.drag 已被 pointerup 清空，不能再卖 */
    if (ui.drag && !ui.drag.moved && ui.drag.uid === uid){
      const r = sellCard(uid);
      if (r.ok){
        toast(`出售返还 ${r.gold} 金`);
        if (navigator.vibrate) navigator.vibrate(30);
        if (ui.drag){ ui.drag.ghost.remove(); ui.drag = null; }
        sync();
      }
    }
  }, 550);
}

/* ---------- 提示浮层 ---------- */
function tipAt(x, y, html){
  const t = $('itemTip');
  t.innerHTML = html;
  t.classList.add('on');
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
  t.style.top = Math.max(8, y - h - 14) + 'px';
}
function hideTip(){ $('itemTip').classList.remove('on'); }
document.addEventListener('pointerdown', e => {
  if (!e.target.closest || !e.target.closest('.itemCell')) hideTip();
}, true);

function showItemTip(key, x, y){
  const it = isBig(key) ? BIG_ITEMS[key] : BASE_ITEMS[key];
  const fxText = [];
  for (let i = 0; i < it.fx.length; i += 2){
    const k = it.fx[i], v = it.fx[i + 1];
    const label = {['as%']:'攻速', ['atk%']:'攻击', ['crit%']:'暴击率', ['critDmg%']:'暴击伤害', ['pen']:'破甲', ['hp+']:'生命', ['ar+']:'护甲', ['mr+']:'魔抗', ['regen']:'回蓝', ['sp']:'技能强度'}[k] || k;
    fxText.push(`${label} +${k.endsWith('%') ? Math.round(v * 100) + '%' : v}`);
  }
  const trgNames = {splash:'普攻溅射', penHit:'攻击破甲', trueHit:'真实伤害', dotHit:'攻击挂 DOT', slowHit:'攻击减速', knock:'攻击击退眩晕', reflect:'反弹伤害', auraDR:'全队减伤光环', teamShield:'开场全队护盾', spellPower:'技能伤害提升', regen:'回蓝提升', dr:'受伤减免'};
  const trg = (it.trg || []).filter((_, i) => i % 2 === 0).map(t => trgNames[t] || t);
  tipAt(x, y, `<b>${itemName(key)}</b>${it.ic}<span class="d">${fxText.join(' · ')}</span>${trg.length ? `<span class="fx">特效：${trg.join('、')}</span>` : ''}`);
}
function showUnitTip(uid, x, y){
  const card = findCard(uid);
  if (!card) return;
  const def = U_BY_ID[card.id];
  const items = card.items.length ? `<span class="fx">装备：${card.items.map(itemName).join('、')}</span>` : '';
  tipAt(x, y, `<b>${def.name}</b>（${'★'.repeat(card.star)}）<span class="d">${NATIONS[def.na]} · ${ROLES[def.role].name} · ${TRAITS[def.trait].name}</span><span class="d">绝技：${def.quote}</span>${items}`);
}

/* ============================================================
   战斗渲染
   ============================================================ */
const fx = [];
function addFx(o){ fx.push(Object.assign({life:.8, t:0}, o)); }

function drawPrep(g){
  const w = ui.w, h = ui.h, cell = G.cell;
  drawField(g, w, h);
  /* 自家半场可放置格：呼吸光效 */
  const t = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
  const breathe = .5 + .5 * Math.sin(t * 2.2);
  for (let row = 0; row < ROWS; row++){
    for (let col = 0; col < COLS / 2; col++){
      const p = hexPos(col, row, cell);
      const occ = G.board.some(c => c.col === col && c.row === row);
      hexPath(g, p.x, p.y, cell * .92);
      g.fillStyle = occ ? 'rgba(0,0,0,.12)' : `rgba(255,255,255,${(.05 + breathe * .035).toFixed(3)})`;
      g.fill();
      g.strokeStyle = occ ? 'rgba(255,255,255,.22)' : `rgba(255,255,255,${(.3 + breathe * .16).toFixed(3)})`;
      g.lineWidth = occ ? 1 : 1.4;
      g.stroke();
      g.lineWidth = 1;
    }
  }
  /* foe 预览（半透明 + 轻浮动） */
  G.foe.forEach((c, i) => {
    const p = hexPos(c.col, c.row, cell);
    g.globalAlpha = .45;
    drawFighter(g, c.def, c.star, p.x, p.y + Math.sin(t * 1.8 + i * 1.7) * cell * .03, cell, -1, 1, 1, {});
    g.globalAlpha = 1;
  });
  /* 自家单位（待机浮动） */
  G.board.forEach(c => {
    const p = hexPos(c.col, c.row, cell);
    const def = U_BY_ID[c.id];
    const bob = Math.sin(t * 2.2 + c.col * 1.3 + c.row * .7) * cell * .04;
    drawFighter(g, def, c.star, p.x, p.y + bob, cell, 1, 1, 1, {});
    drawBars(g, {hp:1, maxHp:1, shield:0, mana:0, maxMana:100, star:c.star, x:p.x, y:p.y + bob}, cell);
  });
  /* 拖拽悬停高亮 */
  const d = ui.drag;
  if (d && d.moved && d.hover && d.hover.col < COLS / 2){
    const p = hexPos(d.hover.col, d.hover.row, cell);
    hexPath(g, p.x, p.y, cell * .9);
    g.fillStyle = 'rgba(255,255,120,.25)';
    g.fill();
    g.strokeStyle = '#ffeb6a'; g.lineWidth = 2; g.stroke(); g.lineWidth = 1;
  }
}

/* ===== 球场渲染（条纹 + 聚光 + 暗角，渐变按尺寸缓存） ===== */
let _field = {key:'', base:null, vig:null, spot:null};
function buildField(g, w, h){
  const base = g.createLinearGradient(0, 0, 0, h);
  base.addColorStop(0, '#1a6e51'); base.addColorStop(.5, '#14563f'); base.addColorStop(1, '#0f4432');
  const vig = g.createRadialGradient(w/2, h/2, Math.min(w,h)*.32, w/2, h/2, Math.max(w,h)*.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,10,5,.5)');
  const spot = g.createRadialGradient(w/2, -h*.08, 8, w/2, h*.42, h*1.05);
  spot.addColorStop(0, 'rgba(255,255,255,.2)'); spot.addColorStop(1, 'rgba(255,255,255,0)');
  _field = {key:w+'x'+h, base, vig, spot};
}
function drawField(g, w, h){
  if (_field.key !== w+'x'+h) buildField(g, w, h);
  const F = _field, cell = G.cell;
  /* 底色 */
  g.fillStyle = F.base; g.fillRect(0, 0, w, h);
  /* 剪草条纹（纵向明暗带） */
  const band = Math.max(24, w / 16);
  g.fillStyle = 'rgba(255,255,255,.038)';
  for (let x = 0, i = 0; x < w; x += band, i++) if (i % 2 === 0) g.fillRect(x, 0, band, h);
  g.fillStyle = 'rgba(0,0,0,.055)';
  for (let x = 0, i = 0; x < w; x += band, i++) if (i % 2 === 1) g.fillRect(x, 0, band, h);
  /* 线条 */
  g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(w/2, 0); g.lineTo(w/2, h); g.stroke();
  g.beginPath(); g.arc(w/2, h/2, cell*.85, 0, 7); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.beginPath(); g.arc(w/2, h/2, 3.5, 0, 7); g.fill();
  /* 大小禁区（左右） */
  const pw = cell*1.15, ph = cell*2.7, sw = cell*.55, sh = cell*1.3;
  g.strokeRect(-2, h/2 - ph/2, pw, ph);
  g.strokeRect(w - pw + 2, h/2 - ph/2, pw, ph);
  g.strokeRect(-2, h/2 - sh/2, sw, sh);
  g.strokeRect(w - sw + 2, h/2 - sh/2, sw, sh);
  /* 球门（带网-depth） */
  g.fillStyle = 'rgba(255,255,255,.24)';
  g.fillRect(0, h/2 - cell*.95, 9, cell*1.9);
  g.fillRect(w - 9, h/2 - cell*.95, 9, cell*1.9);
  g.fillStyle = 'rgba(255,255,255,.12)';
  g.fillRect(9, h/2 - cell*.95, 5, cell*1.9);
  g.fillRect(w - 14, h/2 - cell*.95, 5, cell*1.9);
  /* 角球弧 */
  g.strokeStyle = 'rgba(255,255,255,.32)';
  const cs = [[0,0,0,Math.PI/2],[w,0,Math.PI/2,Math.PI],[0,h,-Math.PI/2,0],[w,h,Math.PI,-Math.PI/2]];
  cs.forEach(([x,y,a1,a2]) => { g.beginPath(); g.arc(x, y, cell*.34, a1, a2); g.stroke(); });
  /* 聚光 + 暗角 */
  g.fillStyle = F.spot; g.fillRect(0, 0, w, h);
  g.fillStyle = F.vig; g.fillRect(0, 0, w, h);
  g.lineWidth = 1;
}

function hexPath(g, cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 180 * (60 * i - 90);
    const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}

/* 选手绘制（支持动画：摆腿/摆臂/前倾/落地压缩/施法光晕）
   anim = {bob, leg, legAmp, lean, squash, glow} */
function drawFighter(g, def, star, x, y, cell, face, alpha, scale, anim){
  const s = (scale || 1) * cell / 64;
  const A = anim || {};
  g.save();
  g.globalAlpha = (g.globalAlpha == null ? 1 : g.globalAlpha) * (alpha == null ? 1 : alpha);
  g.translate(x, y + (A.bob || 0));
  if (A.lean) g.rotate(A.lean);
  if (A.squash && A.squash !== 1) g.scale(1, A.squash);
  /* 施法光晕 */
  if (A.glow){
    const gg = g.createRadialGradient(0, -cell * .1, 2, 0, -cell * .1, cell * .85);
    gg.addColorStop(0, A.glow); gg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gg;
    g.beginPath(); g.arc(0, -cell * .1, cell * .85, 0, 7); g.fill();
  }
  /* 影子 */
  g.fillStyle = 'rgba(0,0,0,.25)';
  g.beginPath(); g.ellipse(0, cell * .42, cell * .26, cell * .1, 0, 0, 7); g.fill();
  /* 腿（跑动摆动，两腿反相） */
  const amp = A.legAmp == null ? 1 : A.legAmp;
  const ph = A.leg || 0;
  const swing = Math.sin(ph) * cell * .13 * amp;
  const lift1 = Math.max(0, Math.sin(ph)) * cell * .06 * amp;
  const lift2 = Math.max(0, -Math.sin(ph)) * cell * .06 * amp;
  g.strokeStyle = '#2b2b2b'; g.lineWidth = 3 * s;
  g.beginPath();
  g.moveTo(-4 * s, cell * .18); g.lineTo(-5 * s - swing, cell * .4 - lift1);
  g.moveTo(4 * s, cell * .18); g.lineTo(5 * s + swing, cell * .4 - lift2);
  g.stroke();
  /* 手臂（摆臂，与腿反相） */
  const arm = A.leg ? Math.sin(A.leg + Math.PI) * cell * .1 * amp : 0;
  g.strokeStyle = shadeHex(def.jc, -.3); g.lineWidth = 2.6 * s;
  g.beginPath();
  g.moveTo(-8 * s, -2 * s); g.lineTo(-9 * s - arm * .5, cell * .1);
  g.moveTo(8 * s, -2 * s); g.lineTo(9 * s + arm * .5, cell * .1);
  g.stroke();
  /* 身体（球衣） */
  g.fillStyle = def.jc;
  g.beginPath();
  g.moveTo(-9 * s, cell * .2); g.quadraticCurveTo(-11 * s, 0, -7 * s, -3 * s);
  g.lineTo(7 * s, -3 * s); g.quadraticCurveTo(11 * s, 0, 9 * s, cell * .2);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1 * s; g.stroke();
  /* 号码 */
  g.fillStyle = 'rgba(255,255,255,.9)';
  g.font = `700 ${8 * s}px sans-serif`; g.textAlign = 'center';
  g.fillText(String(def.num), 0, cell * .13);
  /* 头 */
  g.fillStyle = def.skin;
  g.beginPath(); g.arc(0, -9 * s, 8 * s, 0, 7); g.fill();
  /* 头发 */
  g.fillStyle = def.hair;
  const stl = def.style;
  if (stl === 'afro'){ g.beginPath(); g.arc(0, -11 * s, 9 * s, Math.PI, 0); g.fill(); }
  else if (stl === 'bald'){ /* 无 */ }
  else if (stl === 'long'){ g.beginPath(); g.arc(0, -10 * s, 9 * s, Math.PI, 0); g.fill();
    g.beginPath(); g.ellipse(0, -5 * s, 9 * s, 6 * s, 0, 0, Math.PI); g.fill(); }
  else if (stl === 'curly'){ for (let i = 0; i < 5; i++){ g.beginPath(); g.arc((-7 + i * 3.5) * s, (-14 + (i % 2) * 2) * s, 3 * s, 0, 7); g.fill(); } }
  else { g.beginPath(); g.arc(0, -11 * s, 8.4 * s, Math.PI, 0); g.fill(); }
  /* 眼睛（朝上） */
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(-3 * s, -8 * s, 1.8 * s, 0, 7); g.arc(3 * s, -8 * s, 1.8 * s, 0, 7); g.fill();
  g.fillStyle = '#222';
  g.beginPath(); g.arc(-2.7 * s, -7.8 * s, .9 * s, 0, 7); g.arc(3.3 * s, -7.8 * s, .9 * s, 0, 7); g.fill();
  /* 星级 */
  if (star > 1){
    g.fillStyle = '#ffd76a';
    for (let i = 0; i < star - 1; i++){
      g.beginPath(); g.arc((-4 + i * 8) * s, -cell * .52, 2.6 * s, 0, 7); g.fill();
    }
  }
  g.restore();
}

function rr(g, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function drawBars(g, u, cell){
  const bw = cell * .62, bh = Math.max(3, cell * .07);
  const x = u.x - bw / 2, y = u.y - cell * .62;
  /* 血条底板 */
  g.fillStyle = 'rgba(0,0,0,.55)';
  rr(g, x - 1, y - 1, bw + 2, bh + 2, 3); g.fill();
  const pct = Math.max(0, u.hp / u.maxHp);
  g.fillStyle = pct > .5 ? '#57c26b' : pct > .25 ? '#e8b93c' : '#e05a4e';
  rr(g, x, y, Math.max(bw * pct, bh), bh, 2); g.fill();
  /* 顶部高光 */
  g.fillStyle = 'rgba(255,255,255,.28)';
  rr(g, x, y, Math.max(bw * pct, bh), bh * .42, 2); g.fill();
  if (u.shield > 0){
    g.fillStyle = '#e8f2ff';
    rr(g, x, y, bw * Math.min(1, u.shield / u.maxHp), bh * .4, 2); g.fill();
  }
  /* 蓝条 */
  const my = y + bh + 2;
  g.fillStyle = 'rgba(0,0,0,.5)';
  rr(g, x - 1, my - 1, bw + 2, bh * .6 + 2, 2.5); g.fill();
  g.fillStyle = '#4f9de0';
  rr(g, x, my, bw * Math.min(1, u.mana / u.maxMana), bh * .6, 1.6); g.fill();
  g.fillStyle = 'rgba(255,255,255,.3)';
  rr(g, x, my, bw * Math.min(1, u.mana / u.maxMana), bh * .26, 1.6); g.fill();
}

function drawBattle(g, dt){
  const w = ui.w, h = ui.h;
  const bt = G.bt;
  /* 绝技释放时的震屏 */
  g.save();
  if (bt && bt.shake > 0) g.translate((rnd() - .5) * bt.shake, (rnd() - .5) * bt.shake);
  drawField(g, w, h);
  if (!bt){ g.restore(); return; }
  /* 网格淡淡的己方半场 */
  g.globalAlpha = .12;
  for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS / 2; col++){
    const p = hexPos(col, row, G.cell);
    hexPath(g, p.x, p.y, G.cell * .88);
    g.strokeStyle = '#fff'; g.stroke();
  }
  g.globalAlpha = 1;
  /* 单位（按 y 排序） */
  const units = bt.units.filter(u => u.alive).sort((a, b) => a.y - b.y);
  const cell = G.cell;
  units.forEach(u => {
    /* 入场：从上方错峰弹入 + 落地压缩 */
    const delay = (u._i || 0) * .06;
    const et = bt.t - delay;
    const p = Math.max(0, Math.min(1, et / .45));
    const ease = 1 - Math.pow(1 - p, 3);
    let yOff = -(1 - ease) * cell * 2.6;
    let squash = 1;
    if (et > .45 && et < .64){ const k = (et - .45) / .19; squash = 1 - Math.sin(k * Math.PI) * .22; }
    /* 待机浮动 */
    if (p >= 1 && !(u.walk > .1)) yOff += Math.sin(bt.t * 2.4 + (u._ph || 0) * 6.28) * cell * .035;
    /* 胜利跳跃 */
    if (bt.over && u.side === bt.winner){
      const jt = (bt.t * 1.3 + (u._ph || 0)) % 1;
      yOff -= Math.abs(Math.sin(jt * Math.PI)) * cell * .32;
      squash = 1 + Math.abs(Math.sin(jt * Math.PI)) * .1;
    }
    const alpha = Math.min(1, p * 2.2);
    const uy = u.y + yOff;
    drawFighter(g, u.def, u.star, u.x, uy, cell, u.face, alpha, 1, {
      leg: u.walkPhase || 0, legAmp: u.walk || 0,
      lean: (u.atkA || 0) * .14 * (u.face || 1),
      squash,
      glow: (u.castA || 0) > .05 ? `rgba(255,220,120,${((u.castA) * .5).toFixed(3)})` : null,
    });
    if (u.hitFlash > 0){
      g.save();
      g.globalAlpha = Math.min(.7, u.hitFlash * 4) * alpha;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(u.x, uy - cell * .1, cell * .3, 0, 7); g.fill();
      g.restore();
    }
    if (u.stun > 0){
      g.globalAlpha = alpha;
      g.fillStyle = '#ffd76a';
      g.font = `${cell * .3}px sans-serif`; g.textAlign = 'center';
      g.fillText('★', u.x, uy - cell * .78);
      g.globalAlpha = 1;
    }
    if (alpha >= 1) drawBars(g, Object.assign({}, u, {y: uy}), cell);
  });
  /* 特效 */
  for (let i = fx.length - 1; i >= 0; i--){
    const f = fx[i];
    f.t += dt;
    if (f.t >= f.life){ fx.splice(i, 1); continue; }
    const k = f.t / f.life;
    g.save();
    if (f.type === 'float'){
      g.globalAlpha = 1 - k;
      g.fillStyle = f.color;
      g.font = `${f.crit ? '700 ' : ''}${f.size || 14}px sans-serif`;
      g.textAlign = 'center';
      g.fillText(f.text, f.x, f.y - k * 34);
    } else if (f.type === 'ring'){
      g.globalAlpha = (1 - k) * .8;
      g.strokeStyle = f.color;
      g.lineWidth = 3;
      g.beginPath(); g.arc(f.x, f.y, f.r * k, 0, 7); g.stroke();
      g.globalAlpha = (1 - k) * .18;
      g.fillStyle = f.color;
      g.beginPath(); g.arc(f.x, f.y, f.r * k, 0, 7); g.fill();
    } else if (f.type === 'ball'){
      g.globalAlpha = 1 - k * .3;
      const px = f.x1 + (f.x2 - f.x1) * k, py = f.y1 + (f.y2 - f.y1) * k - Math.sin(k * Math.PI) * 18;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(px, py, 5, 0, 7); g.fill();
      g.strokeStyle = '#333'; g.lineWidth = 1; g.stroke();
    } else if (f.type === 'skillName'){
      g.globalAlpha = 1 - k;
      g.fillStyle = f.color;
      g.font = `700 ${f.size || 15}px sans-serif`;
      g.textAlign = 'center';
      g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = 3;
      g.strokeText(f.text, f.x, f.y - 20 - k * 26);
      g.fillText(f.text, f.x, f.y - 20 - k * 26);
    }
    g.restore();
  }
  g.restore();
}

/* ---------- 战斗事件 → 特效 ---------- */
const SKILL_COLOR = {aoe:'#f09530', burst:'#f06030', dash:'#5aa8e8', buff:'#6fc96b', cc:'#b48ae8', shield:'#cfe4ff', snipe:'#ffe08a', dot:'#c96be8', heal:'#f09ac0'};
function consumeEvents(bt){
  bt.events.forEach(e => {
    if (e.t === 'hit'){
      fx.push({type:'float', x:e.x + (rnd() - .5) * 14, y:e.y - 10, text:e.v, color:e.crit ? '#ffd24a' : '#fff', crit:e.crit, life:.7, size:e.crit ? 17 : 13});
    } else if (e.t === 'shieldHit'){
      fx.push({type:'float', x:e.x, y:e.y - 16, text:'-' + e.v, color:'#bcd6ff', life:.6, size:12});
    } else if (e.t === 'heal'){
      fx.push({type:'float', x:e.x, y:e.y - 16, text:'+' + e.v, color:'#8fe08a', life:.7});
    } else if (e.t === 'skill'){
      if (e.side === 0 && rnd() < .5) AudioFX.skill();
      const color = SKILL_COLOR[e.kind] || '#fff';
      fx.push({type:'ring', x:e.x, y:e.y, r:e.r || 60, color, life:.5});
      if (e.tx != null) fx.push({type:'ball', x1:e.x, y1:e.y, x2:e.tx, y2:e.ty, color, life:.25});
      if (e.name) fx.push({type:'skillName', x:e.x, y:e.y, text:e.name, color:'#ffe9a8', life:.9});
      maybeCoach(e);
    } else if (e.t === 'die'){
      fx.push({type:'ring', x:e.x, y:e.y, r:30, color:'#ffffff', life:.4});
    }
  });
  bt.events.length = 0;
}

/* ---------- 教练小狼 ---------- */
let coachBattleT = 0;
function maybeCoach(e){
  if (!e || e.t !== 'skill') return;
  if (rnd() < .25){
    coachSay(e.side === 0 ? pick(['好球！','这招漂亮！','就是这样！','干得漂亮！']) : pick(['小心！','防住他！','别慌！','拦住！']));
  }
}
function coachIdle(bt){
  coachBattleT += 1;
  if (coachBattleT % 300 === 0 && rnd() < .5){
    coachSay(pick(['稳住节奏！','找空档！','传起来！','看准时机！']));
  }
}

/* ---------- 主循环 ---------- */
let overT = -1;
function loop(ts){
  ui.raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, (ts - (ui.last || ts)) / 1000);
  ui.last = ts;
  const g = canvasOf().getContext('2d');
  if (G.phase === 'battle' && G.bt){
    const bt = G.bt;
    const sdt = dt * ui.speed;
    bt.step(sdt);
    consumeEvents(bt);
    drawBattle(g, dt);
    coachIdle(bt);
    if (bt.over && overT < 0) overT = 0;
    if (overT >= 0){
      overT += dt;
      if (overT > 1.1){
        overT = -1;
        endBattle();
        const R = G.result;
        if (R.champion){ AudioFX.win(); banner('冠军诞生', '🏆 捧杯之夜', '坚守 15 回合，冠军属于你！'); }
        else if (R.lose){ AudioFX.lose(); banner('淘汰出局', '赛季结束', '总结经验，下季再来'); }
        else if (R.win){ AudioFX.win(); banner('战斗胜利', '对方全员溃败', `金币 +${R.inc}`); }
        else { AudioFX.lose(); banner('战斗失败', '防线失守', `生命 -${R.dmg}`); }
        resultModal();
        sync();
        coachSay(G.result.win ? '赢了！漂亮！' : '别灰心，下一局找回来！');
      }
    }
  } else {
    overT = -1;
    drawPrep(g);
  }
}

boot();
bindCardEvents();
requestAnimationFrame(loop);
</script>
