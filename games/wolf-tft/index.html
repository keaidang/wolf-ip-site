<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d5c3f">
<title>狼之棋阵 · 足球明星自走棋</title>
<style>
:root{
  --bg:#14161a; --surface:#1d2026; --surface2:#262a32; --ink:#e9e7e0; --ink2:#a5a89e; --ink3:#6e726b;
  --line:#333842; --line2:#454b56;
  --green:#18a06e; --green2:#2bd396; --gold:#e8b93c; --gold2:#ffd76a;
  --c1:#8a8779; --c2:#5f9e3f; --c3:#3a86c8; --c4:#7f6dd0; --c5:#e0952a;
  --red:#e0685e; --hp:#d0554b; --mp:#3f7fc8;
  --r:10px; --rs:7px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 420px at 50% -90px, #232b36 0%, rgba(35,43,54,0) 70%),
    var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:13px; line-height:1.5; overflow:hidden; user-select:none; -webkit-user-select:none;
  touch-action:manipulation;
}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none}
img{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none}
#coach img,.hex img,.shopItem img,#ghost img{pointer-events:none}
#app{height:100%;display:flex;flex-direction:column;min-width:0}

/* ===== 顶栏 ===== */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 10px; position:relative;
  background:linear-gradient(180deg,#17352b,#0e241d); color:#fff;
  box-shadow:inset 0 1px 0 #ffffff1f, 0 1px 3px #0000004d;
}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold2) 30%,var(--gold) 70%,transparent);opacity:.9}
#topbar .brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;white-space:nowrap}
#topbar .brand img{width:26px;height:26px;border-radius:6px;background:#fff2}
#stageInfo{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.95;white-space:nowrap}
#stageInfo b{font-weight:600}
.stat{display:flex;align-items:center;gap:4px;background:#ffffff1f;border-radius:20px;padding:3px 9px;font-size:12px;white-space:nowrap}
.stat.gold{background:linear-gradient(180deg,#f0c05a,#d9a82e);color:#4a3508;box-shadow:inset 0 1px 0 #ffffff5c, 0 1px 3px #26241f33}
.stat.hp{background:#e0736a2e;box-shadow:inset 0 1px 0 #ffffff1f}
.stat .ic{width:13px;height:13px;opacity:.9;flex:0 0 auto}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
#lvWrap{display:flex;align-items:center;gap:6px}
#lvBar{width:64px;height:6px;background:#ffffff30;border-radius:3px;overflow:hidden}
#lvBar i{display:block;height:100%;background:var(--gold2);width:0%;transition:width .25s}
#topSpacer{flex:1}
#btnHelp{background:#ffffff26;border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap}

/* ===== 主区 ===== */
#main{flex:1;display:grid;grid-template-columns:1fr 348px;grid-template-rows:1fr auto;gap:8px;padding:8px;min-height:0}
#arenaCol{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#boardCol{grid-column:1;grid-row:2;min-width:0}
#panel{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 2px #00000040, 0 4px 14px #00000033}
.card h3{font-size:12px;font-weight:600;color:var(--ink2);padding:7px 10px 5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.card h3::before{content:"";flex:0 0 auto;width:3px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,var(--gold2),var(--gold))}
.card h3 .sub{font-weight:400;color:var(--ink3);font-size:11px}
.card .body{padding:0 10px 9px}

/* ===== 战场 ===== */
#arenaWrap{position:relative;flex:1;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
#coach{position:absolute;left:10px;bottom:8px;display:flex;align-items:flex-end;gap:8px;pointer-events:none;z-index:5}
#coach img{width:56px;height:56px;filter:drop-shadow(0 2px 3px #0004)}
#coachSay{
  background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:4px 10px;font-size:12px;
  color:var(--ink);box-shadow:0 2px 8px #0006;margin-bottom:14px;max-width:220px;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;position:relative;
}
#coachSay.on{opacity:1;transform:none}
#coachSay::after{content:"";position:absolute;left:-5px;bottom:9px;width:8px;height:8px;background:var(--surface2);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
#phaseTag{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:#0f2e23d9;backdrop-filter:blur(4px);color:#fff;font-size:12px;padding:3px 14px;border-radius:20px;letter-spacing:2px;
  box-shadow:0 2px 8px #0004, inset 0 1px 0 #ffffff1f;
}
#speedTag{position:absolute;top:8px;right:8px;z-index:6;background:#000000a8;backdrop-filter:blur(4px);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px}

/* ===== 备战区 ===== */
#board{display:flex;gap:7px;padding:7px;overflow-x:auto;overflow-y:hidden;min-height:76px;align-items:center;scrollbar-width:thin}
.slot{
  flex:0 0 auto;width:60px;height:70px;border-radius:9px;border:1.5px dashed var(--line2);
  background:#ffffff0a;position:relative;transition:transform .12s,border-color .12s;
  box-shadow:inset 0 1px 3px #0000004d;
}
.slot.over{border-color:var(--green2);background:#2bd3962e;transform:scale(1.04)}
.hex{
  flex:0 0 auto;width:46px;height:52px;position:relative;cursor:grab;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:#3a4049;transition:transform .12s;touch-action:none;
}
.hex:active{cursor:grabbing}
.hex.drag{opacity:.35}
.hex .face{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#23272e;overflow:hidden}
.hex canvas{width:100%;height:100%;display:block}
.hex .cost{
  position:absolute;top:-1px;left:50%;transform:translateX(-50%);z-index:3;
  font-size:9px;color:#fff;background:#0009;border-radius:0 0 6px 6px;padding:0 5px;line-height:13px;font-weight:600;
}
.hex .star{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);z-index:3;font-size:8px;color:#ffd76a;text-shadow:0 0 2px #000;letter-spacing:1px;line-height:1}
.hex .itm{position:absolute;top:2px;right:2px;z-index:3;display:flex;flex-direction:column;gap:2px}
.hex .itm i{width:9px;height:9px;border-radius:50%;border:1px solid #fff9;display:block}
.hex.big{width:56px;height:64px}
.hex.picked{animation:pop .22s}
@keyframes pop{40%{transform:scale(1.18)}}
.hex.owned{cursor:pointer}

/* ===== 右侧面板 ===== */
#phaseBtn{
  width:100%;padding:11px;border-radius:var(--r);font-size:15px;font-weight:600;letter-spacing:3px;
  background:linear-gradient(180deg,#e0483c,#c0392b);color:#fff;box-shadow:0 2px 0 #8e2b20;
  position:relative;overflow:hidden;
}
#phaseBtn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
  background:linear-gradient(100deg,transparent,#ffffff3d,transparent);transform:skewX(-20deg)}
@media (hover:hover){#phaseBtn:hover::after{animation:shine .8s ease}
  #phaseBtn:hover{filter:brightness(1.06)}}
@keyframes shine{to{left:130%}}
#phaseBtn:active{transform:translateY(2px);box-shadow:none}
#phaseBtn.ready{background:linear-gradient(180deg,#22b37c,#0f7d57);box-shadow:0 2px 0 #073a28}
#shopRow{display:flex;gap:6px}
.shopBtn{
  flex:1;padding:8px 0;border-radius:var(--rs);background:var(--surface2);border:1px solid var(--line2);
  font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
}
.shopBtn:active{transform:translateY(1px)}
.shopBtn .g{color:var(--gold);font-weight:700}
.shopBtn:disabled{opacity:.45}
#shopList{display:flex;flex-direction:column;gap:6px;padding:2px 0 4px}
.shopItem{
  display:flex;align-items:center;gap:8px;padding:6px;border-radius:var(--rs);
  background:var(--surface2);border:1px solid var(--line);cursor:grab;touch-action:none;position:relative;
  box-shadow:inset 3px 0 0 var(--rc,#0000), 0 1px 2px #26241f0a;
}
.shopItem:active{cursor:grabbing}
.shopItem.bought{opacity:.35;pointer-events:none}
.shopItem .nm{flex:1;min-width:0}
.shopItem .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopItem .nm span{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.shopItem .buy{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  background:linear-gradient(180deg,#f0c05a,#c8961e);
  box-shadow:0 1px 3px #c8961e59, inset 0 1px 0 #ffffff5c;
}
.shopItem.locked .buy{background:#9a968a}
.shopItem.leg5{background:linear-gradient(90deg,#4a3a17 0%,var(--surface2) 45%)}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;background:#ffffff16;color:var(--ink2);margin-right:3px;line-height:15px;vertical-align:1px}

/* 羁绊 */
#traitList{display:flex;flex-wrap:wrap;gap:5px}
.traitChip{
  display:flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--line);color:var(--ink3);
}
.traitChip.on{color:#fff;border-color:transparent;font-weight:600;
  box-shadow:0 1px 6px #26241f33, inset 0 1px 0 #ffffff3d}
.traitChip .n{font-weight:700;font-variant-numeric:tabular-nums}
.traitChip .dots{letter-spacing:1px;font-size:10px}

/* 装备栏 */
#itemGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.itemCell{
  aspect-ratio:1;border-radius:8px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#eef0ea);
  box-shadow:inset 0 1px 0 #fff, 0 1px 2px #26241f0f;
  display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;cursor:grab;touch-action:none;
}
.itemCell:active{cursor:grabbing}
.itemCell.over{border-color:var(--green2);background:#2bd39633;box-shadow:0 0 0 3px #2bd39633}
.itemCell.empty{border-style:dashed;cursor:default;color:var(--ink3);font-size:16px}
.itemCell .cnt{position:absolute;right:2px;bottom:0;font-size:9px;color:var(--ink2);font-weight:600}
.itemTip{
  position:fixed;z-index:99;background:#101318f0;color:#e9e7e0;font-size:11.5px;padding:8px 10px;border-radius:8px;
  max-width:230px;pointer-events:none;opacity:0;transition:opacity .12s;line-height:1.55;box-shadow:0 4px 14px #0008;border:1px solid var(--line);
}
.itemTip.on{opacity:1}
.itemTip b{color:var(--gold2)}
.itemTip .d{display:block;margin-top:3px;color:#b9bcc4}
.itemTip .fx{display:block;margin-top:3px;color:#9fd8be}

/* 符文 */
#augBox{padding:7px 10px 9px}
#augName{font-size:13px;font-weight:600;color:var(--green2)}
#augDesc{font-size:11.5px;color:var(--ink2);margin-top:1px}
#augEmpty{font-size:11.5px;color:var(--ink3)}

/* 对手 */
#foeRow{display:flex;align-items:center;gap:8px;padding:2px 0 4px}
#foeRow .foeAv{width:38px;height:38px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px}
#foeRow .foeInfo{flex:1;min-width:0}
#foeRow .foeInfo b{font-size:12.5px;display:block}
#foeRow .foeInfo span{font-size:11px;color:var(--ink2)}
#foeList{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
#foeList .hex{width:34px;height:39px;cursor:default}

/* ===== 弹窗 ===== */
#modal{position:fixed;inset:0;background:#0a0c10e0;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.sheet{
  background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:min(88vh,760px);
  overflow-y:auto;padding:18px 20px;box-shadow:0 10px 40px #0006;border:1px solid var(--line);
  animation:sheetIn .24s cubic-bezier(.2,.9,.3,1.15);
}
@keyframes sheetIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
.sheet.champ{border-color:var(--gold2);box-shadow:0 10px 40px #0006, 0 0 28px #f0c05a47}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sheet .lead{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.sheet .big{font-size:40px;text-align:center;margin:6px 0 10px}
.btn{
  display:inline-block;padding:9px 22px;border-radius:9px;background:var(--green);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:1px;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
.center{text-align:center}
.augGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:8px 0 14px}
.augCard{
  border:1.5px solid var(--line2);border-radius:12px;padding:12px;cursor:pointer;
  background:linear-gradient(180deg,#272c34,#20242b);
  box-shadow:0 1px 3px #0000004d;
  transition:border-color .12s,transform .12s;
}
.augCard:hover,.augCard:active{border-color:var(--green2);transform:translateY(-2px)}
.augCard .r{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px}
.augCard b{display:block;font-size:13.5px;margin:3px 0 4px}
.augCard span{font-size:11.5px;color:var(--ink2);line-height:1.5}
.helpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.helpGrid h4{font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green2)}
.helpGrid p,.helpGrid li{font-size:12px;color:var(--ink2);line-height:1.65}
.helpGrid ul{padding-left:16px}
#ovList{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
#ovList .hex{width:52px;height:59px;cursor:default}
#ovList .slot2{width:52px;height:59px;border-radius:8px;border:1.5px dashed var(--line2)}

/* toast */
#toast{
  position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-8px);z-index:80;
  background:#101318f0;color:#e9e7e0;font-size:12.5px;padding:8px 16px;border-radius:20px;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86vw;text-align:center;
  border:1px solid var(--line);box-shadow:0 4px 16px #0008;
}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ===== 手机竖屏 ===== */
@media (max-width:1079px){
  #main{grid-template-columns:1fr;grid-template-rows:auto minmax(120px,1fr) auto auto;gap:6px;padding:6px}
  #arenaCol{grid-column:1;grid-row:2}
  #boardCol{grid-column:1;grid-row:3}
  #panel{grid-column:1;grid-row:4;grid-row:4;flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:stretch;max-height:172px}
  #panel .card{flex:0 0 auto;min-width:238px;max-width:280px;overflow-y:auto}
  #panel .card.phaseCard{min-width:150px;max-width:150px;display:flex;flex-direction:column}
  #panel .card.phaseCard .body{flex:1;display:flex;flex-direction:column;justify-content:center}
  #panel .card.foeCard{min-width:210px;max-width:210px}
  #topbar .brand span{display:none}
  #topbar{padding:5px 8px;gap:6px}
  #coach img{width:44px;height:44px}
  #coachSay{font-size:11px;max-width:150px;margin-bottom:10px}
  .hex{width:40px;height:46px}
  .hex.big{width:46px;height:53px}
  #board{min-height:62px;padding:5px}
  .slot{width:46px;height:54px}
  #shopList{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .shopItem{flex:0 0 auto;width:132px}
  #itemGrid{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:1079px) and (max-height:560px){
  /* 横屏手机：改左右双栏，给战场让高度 */
  #main{grid-template-columns:1fr 232px; grid-template-rows:1fr auto; gap:6px; padding:6px}
  #arenaCol{grid-column:1; grid-row:1}
  #boardCol{grid-column:1; grid-row:2}
  #panel{grid-column:2; grid-row:1/span 2; flex-direction:column; overflow-y:auto; overflow-x:hidden; max-height:none; align-items:stretch}
  #panel .card{min-width:0; max-width:none; width:100%; overflow-y:visible}
  #panel .card.foeCard{min-width:0; max-width:none}
  #shopList{flex-direction:column; overflow-x:visible}
  .shopItem{width:auto}
  #itemGrid{grid-template-columns:repeat(6,1fr)}
  #coach img{width:38px;height:38px}
}
/* ===== 高级感：微交互 / 动效 ===== */
/* 高费球星费用光晕（4 费静态 / 5 费呼吸） */
.hex.glow{filter:drop-shadow(0 0 5px var(--gc,#0000))}
.hex.leg{animation:legGlow 2.4s ease-in-out infinite}
@keyframes legGlow{
  0%,100%{filter:drop-shadow(0 0 4px #e0952a77)}
  50%{filter:drop-shadow(0 0 10px #e0952acc)}
}
#panel::-webkit-scrollbar{width:8px;height:8px}
#panel::-webkit-scrollbar-thumb{background:#3a4049;border-radius:4px}
#panel::-webkit-scrollbar-track{background:transparent}
#board::-webkit-scrollbar{height:6px}
#board::-webkit-scrollbar-thumb{background:#3a4049;border-radius:3px}
@media (hover:hover){
  .hex.owned:hover{transform:translateY(-3px);filter:brightness(1.08)}
  .shopItem:hover{border-color:var(--line2);transform:translateY(1px)}
  .itemCell:hover{transform:scale(1.06)}
  .traitChip:hover{filter:brightness(.97)}
}
.shopBtn:active,.itemCell:active{transform:scale(.96)}
.hex.canMerge{animation:mergeGlow 1.1s ease-in-out infinite}
@keyframes mergeGlow{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.3) drop-shadow(0 0 7px #ffd76a)}
}
.stat.bump{animation:bump .28s ease}
@keyframes bump{35%{transform:scale(1.3)}}
#phaseBtn.ready{animation:readyPulse 1.6s ease-in-out infinite}
@keyframes readyPulse{
  0%,100%{box-shadow:0 2px 0 #073a28}
  50%{box-shadow:0 2px 0 #073a28, 0 0 14px #2bd39677}
}
/* 大字横幅（升星/获得装备） */
#banner{
  position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);z-index:70;
  pointer-events:none;opacity:0;text-align:center;
}
#banner.on{animation:bannerIn 1.5s ease forwards}
@keyframes bannerIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  20%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1.02)}
}
#banner .b1{font-size:15px;color:#ffe9a8;letter-spacing:6px;text-shadow:0 2px 8px #000a;font-weight:600}
#banner .b2{font-size:44px;font-weight:700;color:#fff;letter-spacing:3px;text-shadow:0 0 18px #ffb84dcc,0 3px 10px #000a;margin-top:2px}
#banner .b3{font-size:13px;color:#ffd76a;letter-spacing:2px;margin-top:4px;text-shadow:0 2px 6px #000a}
/* 飞牌动画容器 */
.flyCard{position:fixed;z-index:65;pointer-events:none;transition:transform .38s cubic-bezier(.3,.7,.4,1),opacity .38s;filter:drop-shadow(0 6px 12px #0005)}
/* 战斗结果弹层强化 */
#ovBanner{font-size:26px;font-weight:700;letter-spacing:2px;margin:2px 0 6px}
#ovBanner.win{color:var(--green2)}
#ovBanner.lose{color:var(--red)}
#ovBanner.champ{color:var(--gold)}

@media (min-width:1080px){
  #main{padding:10px;gap:10px}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><img id="brandIcon" alt="" draggable="false"><span>狼之棋阵</span></div>

const AUG_BY_ID = {}; AUGMENTS.forEach(a => AUG_BY_ID[a.id] = a);

/* ---------- 常量 ---------- */
const COLS = 6, ROWS = 3;                 // 战场 6×3
const COST_P = {1:.40, 2:.30, 3:.20, 4:.09, 5:.01};
const EXP_TABLE = [0, 2, 6, 12, 20, 32, 50, 72, 99];  // 升到 lv n 所需累计经验
const MAX_LV = 9;
const SHOP_SIZE = 5;
const START_HP = 100;

/* ============================================================
   逻辑层：纯数据运算，不碰 DOM（供 Node 自测复用）
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const RNG = mulberry32(20261014);
const rnd = () => RNG();
const pick = arr => arr[Math.floor(rnd()*arr.length)];

/* 六边形战场坐标（世界像素） */
function hexPos(col, row, cell){
  const w = cell * Math.sqrt(3);
  const x = (col + (row % 2 ? .5 : 0) + .5) * w + cell * .3;
  const y = (row + .5) * cell * 1.5 + cell * .35;
  return {x, y};
}

/* ---------- 装备工具 ---------- */
function itemKeyOf(a, b){ return [a, b].sort().join('+'); }
function isBig(k){ return k.length > 1; }
function itemName(k){ return ITEM_NAME[k] || k; }

/* 装备属性汇总到单位（attrs 为可变对象） */
function applyItemFx(unit, k, sp){
  const it = isBig(k) ? BIG_ITEMS[k] : BASE_ITEMS[k];
  if (!it) return;
  const fx = it.fx;
  for (let i = 0; i < fx.length; i += 2){
    const key = fx[i], v = fx[i + 1];
    if (key === 'as%') unit.as *= 1 + v;
    else if (key === 'atk%') unit.atk *= 1 + v;
    else if (key === 'crit%') unit.crit = Math.min(.85, unit.crit + v);
    else if (key === 'critDmg%') unit.critDmg += v;
    else if (key === 'pen') unit.pen = Math.min(.9, unit.pen + v);
    else if (key === 'hp+') unit.maxHp += v;
    else if (key === 'ar+') unit.armor += v;
    else if (key === 'mr+') unit.mr += v;
    else if (key === 'regen') unit.regen += v * 100;
    else if (key === 'sp') sp.v += v;
  }
  (it.trg || []).forEach((t, i) => { if (i % 2 === 0){ const pv = it.trg[i + 1]; unit.trg[t] = (unit.trg[t] || 0) + (pv === undefined ? 1 : pv); } });
}

/* ---------- 羁绊计算 ---------- */
/* units: [{def, star}] -> {trait:{k,n}, role:{k,n}} */
function countTraits(units){
  const t = {}, r = {};
  units.forEach(u => { t[u.def.trait] = (t[u.def.trait] || 0) + 1; r[u.def.role] = (r[u.def.role] || 0) + 1; });
  return {trait: t, role: r};
}
/* 激活档位 -> 每档索引（0 起） */
function traitTier(n, lvs){ let tier = -1; for (let i = 0; i < lvs.length; i++) if (n >= lvs[i]) tier = i; return tier; }

/* 生成战斗单位运行时对象 */
function makeUnit(card, side, col, row, cell){
  const def = card.def || U_BY_ID[card.id];
  const s = [1, 1.8, 3.0][card.star - 1];
  const u = {
    card, def, id: def.id, name: def.name, star: card.star, side,
    items: (card.items || []).slice(),
    col, row,
    x: 0, y: 0, vx: 0, vy: 0,
    hp: def.st[0] * s, maxHp: def.st[0] * s,
    atk: def.st[1] * s, as: def.st[2], armor: def.st[3], mr: def.st[4],
    crit: def.st[5], critDmg: 1.45, range: def.st[6], pen: 0,
    mana: 0, maxMana: 100, regen: 8,
    atkCd: 0, alive: true, shield: 0,
    sp: {v: 1}, dr: 0, reflect: 0,
    stun: 0, slow: 0, dotT: 0, dotV: 0,
    atkBuffT: 0, atkBuffV: 0,
    target: null, castT: 0, skillId: def.sk[0], skillP: def.sk[1], skillR: def.sk[2] || 0,
    trg: {}, hitFlash: 0, face: side === 0 ? 1 : -1,
  };
  const p = hexPos(col, row, cell);
  u.x = p.x; u.y = p.y;
  u.homeX = p.x; u.homeY = p.y;
  /* 装备 */
  u.items.forEach(k => applyItemFx(u, k, u.sp));
  return u;
}

/* ---------- 战斗模拟 ---------- */
class Battle {
  /* allies, foes: makeUnit 数组；ctx: {cell, augs:[ids], augTraitBoost} */
  constructor(allies, foes, ctx){
    this.a = allies; this.b = foes; this.ctx = ctx || {};
    this.units = allies.concat(foes);
    this.t = 0; this.over = false; this.winner = -1;
    this.events = [];
    this.cell = (ctx && ctx.cell) || 60;
    this._applyTraits(allies, 0); this._applyTraits(foes, 1);
    this._applyAugs(allies); this._applyAugs(foes);
    this._openShield(allies); this._openShield(foes);
    this.units.forEach(u => { u.hp = u.maxHp; });
    /* 越位陷阱：眩晕对方攻击最高者 */
    if ((ctx.augs || []).includes('a6')){
      const top = this.b.slice().sort((x, y) => y.atk - x.atk)[0];
      if (top){ top.stun = Math.max(top.stun, 2.2); this.events.push({t:'skill', x:top.x, y:top.y, r:40, name:'越位陷阱', kind:'cc', side:0}); }
    }
    /* 录像分析 */
    if ((ctx.augs || []).includes('a10')) this.units.forEach(u => u.atk *= 1.15);
    /* 替补奇兵状态 */
    this.revives = 0;
    /* 动画编号：入场错峰 + 随机相位 */
    this.units.forEach((u, i) => { u._i = i; u._ph = (i * .618) % 1; });
  }
  _applyTraits(units, side){
    const cards = units.map(u => ({def: u.def}));
    const cnt = countTraits(cards);
    Object.keys(cnt.trait).forEach(k => {
      const tier = traitTier(cnt.trait[k], TRAITS[k].lv);
      if (tier < 0) return;
      const [fk, fv] = TRAITS[k].fx[tier];
      units.forEach(u => { if (fk === 'sp') u.sp.v += fv; else if (fk === 'atk') u.atk *= 1 + fv; else if (fk === 'as') u.as *= 1 + fv; else if (fk === 'hp') u.maxHp *= 1 + fv; });
    });
    Object.keys(cnt.role).forEach(k => {
      const tier = traitTier(cnt.role[k], ROLES[k].lv);
      if (tier < 0) return;
      const [fk, fv] = ROLES[k].fx[tier];
      units.forEach(u => {
        if (fk === 'atk') u.atk *= 1 + fv;
        else if (fk === 'regen') u.regen += fv;
        else if (fk === 'ar'){ u.armor += fv; u.mr += fv * .6; }
        else       if (fk === 'teamShield'){ /* 在 _openShield 里统一处理 */ }
      });
      if (k === 'gk' && tier >= 0){
        const shield = ROLES.gk.fx[tier][1];
        units.forEach(u => u.teamShield = shield);
      }
      if (k === 'rising') units.forEach(u => u.traitRegen = true);
    });
    /* 新生代持续回复（4 秒一跳） */
    this['risingT' + side] = 0;
  }
  _openShield(units){
    let mx = 0; units.forEach(u => mx = Math.max(mx, u.teamShield || 0, u.trg.teamShield || 0));
    if (mx > 0) units.forEach(u => u.shield = Math.max(u.shield, mx));
  }
  _applyAugs(units){
    const augs = this.ctx.augs || [];
    units.forEach(u => {
      if (augs.includes('a2') && u.def.trait === 'rising') u.atk *= 1.18;
      if (augs.includes('a3') && u.def.trait === 'legend') u.sp.v += .45;
      if (augs.includes('a4') && u.def.role === 'df'){ u.armor += 40; u.mr += 40; }
      if (augs.includes('a8')) u.augHeal = true;
    });
  }
  foesOf(u){ return u.side === 0 ? this.b : this.a; }
  alliesOf(u){ return u.side === 0 ? this.a : this.b; }
  aliveOf(side){ return (side === 0 ? this.a : this.b).filter(u => u.alive); }
  step(dt){
    if (this.over) return;
    this.t += dt;
    this.shake = Math.max(0, (this.shake || 0) - dt * 16);
    const augs = this.ctx.augs || [];
    /* 闪电战前 12 秒攻速 */
    const blitz = augs.includes('a5') && this.t < 12 ? 1.45 : 1;
    /* 角球旗手 */
    if (augs.includes('a8')){
      ['augHealT0', 'augHealT1'].forEach(k => {
        this[k] = (this[k] || 0) + dt;
        if (this[k] >= 5){ this[k] -= 5; this.units.forEach(u => { if (u.alive) this.heal(u, u.maxHp * .03, false); }); }
      });
    }
    const order = this.units.slice().sort((x, y) => (y.y - x.y));
    order.forEach(u => {
      if (!u.alive) return;
      if (u.hitFlash > 0) u.hitFlash -= dt;
      /* 动画状态衰减 */
      u.atkA = Math.max(0, (u.atkA || 0) - dt * 3.2);
      u.castA = Math.max(0, (u.castA || 0) - dt * 2.2);
      u.walk = Math.max(0, (u.walk || 0) - dt * 5);
      /* 新生代持续回复 */
      if (u.traitRegen){ u._trT = (u._trT || 0) + dt; if (u._trT >= 5){ u._trT -= 5; this.heal(u, u.maxHp * .02, false); } }
      /* dot */
      if (u.dotT > 0){ u.dotT -= dt; u.dotAcc = (u.dotAcc || 0) + dt;
        while (u.dotAcc >= .5){ u.dotAcc -= .5; this.damage(u, u.dotV, {src:u.dotSrc, type:'dot', silent:true}); if (!u.alive) return; }
        if (u.dotT <= 0) u.dotV = 0;
      }
      if (u.stun > 0){ u.stun -= dt; u.castT = Math.max(0, u.castT - dt); return; }
      if (u.castT > 0) u.castT -= dt;
      /* 目标选择 */
      let tg = u.target;
      if (!tg || !tg.alive) tg = u.target = this._nearestFoe(u);
      if (!tg){ /* 无敌人 */ return; }
      const dx = tg.x - u.x, dy = tg.y - u.y;
      const dist = Math.hypot(dx, dy) || 1;
      const rangePx = u.range * this.cell * .82;
      /* 减速 */
      const spd = 205 * (u.slow > 0 ? .55 : 1);
      if (dist > rangePx + 6){
        u.x += dx / dist * spd * dt; u.y += dy / dist * spd * dt;
        u.face = dx > 0 ? 1 : -1;
        u.walk = Math.min(1, (u.walk || 0) + dt * 8);
        u.walkPhase = (u.walkPhase || 0) + dt * 12;
        u.atkCd = Math.max(u.atkCd, .12);
      } else {
        u.atkCd -= dt;
        u.mana = Math.min(u.maxMana, u.mana + u.regen * dt);
        if (u.atkCd <= 0 && u.castT <= 0){
          u.atkCd = 1 / (u.as * blitz);
          this._attack(u, tg);
        }
      }
      if (u.slow > 0) u.slow -= dt;
      if (u.atkBuffT > 0){ u.atkBuffT -= dt; if (u.atkBuffT <= 0) u.atkBuffV = 0; }
      if (u.mana >= u.maxMana && u.castT <= 0) this._cast(u);
    });
    this._checkEnd();
  }
  _nearestFoe(u){
    let best = null, bd = 1e9;
    this.foesOf(u).forEach(f => {
      if (!f.alive) return;
      const d = (f.x - u.x) ** 2 + (f.y - u.y) ** 2;
      if (d < bd){ bd = d; best = f; }
    });
    return best;
  }
  _attack(u, tg){
    const crit = rnd() < u.crit;
    u.atkA = 1;   /* 攻击前倾动画 */
    let dmg = u.atk * (1 + u.atkBuffV) * (crit ? u.critDmg : 1);
    const ev = {t:'atk', x:u.x, y:u.y, tx:tg.x, ty:tg.y, crit, side:u.side, range:u.range};
    this.events.push(ev);
    /* 真实伤害 */
    if (u.trg.trueHit && rnd() < .35) dmg *= 2.2, ev.true = true;
    this.damage(tg, dmg, {src:u, crit, pen:u.pen, type:'atk'});
    if (!tg.alive) return;
    u.mana = Math.min(u.maxMana, u.mana + 18);
    tg.mana = Math.min(tg.maxMana, tg.mana + 8);
    /* 装备触发器 */
    if (u.trg.splash){
      const r = this.cell * .8;
      this.foesOf(u).forEach(f => { if (f !== tg && f.alive && Math.hypot(f.x - tg.x, f.y - tg.y) < r) this.damage(f, dmg * .4, {src:u, pen:u.pen, type:'splash', silent:true}); });
    }
    if (u.trg.penHit){ tg.penDebuff = Math.min(.5, (tg.penDebuff || 0) + .12); tg.penDebuffT = 3; }
    if (u.trg.dotHit){ tg.dotT = 3; tg.dotV = 8 + u.atk * .12; tg.dotSrc = u; }
    if (u.trg.slowHit){ tg.slow = Math.max(tg.slow, 2); }
    if (u.trg.knock && rnd() < .25){
      const dx = tg.x - u.x, dy = tg.y - u.y, d = Math.hypot(dx, dy) || 1;
      tg.x += dx / d * this.cell * .7; tg.y += dy / d * this.cell * .7;
      tg.stun = Math.max(tg.stun, .4);
      this.events.push({t:'skill', x:tg.x, y:tg.y, r:26, name:'击退', kind:'cc', side:u.side});
    }
  }
  _cast(u){
    u.mana = 0; u.castT = .45; u.castA = 1;   /* 施技光晕动画 */
    this.shake = 5;
    const P = u.skillP * u.sp.v, R = this.skillR || u.skillR;
    const foes = this.foesOf(u).filter(f => f.alive);
    const ev = {t:'skill', x:u.x, y:u.y, r:R, name:u.def.skName || u.def.quote, kind:u.skillId, side:u.side};
    this.events.push(ev);
    switch (u.skillId){
      case 'aoe': {
        foes.forEach(f => { if (Math.hypot(f.x - u.x, f.y - u.y) < R + 28) this.damage(f, u.atk * P, {src:u, pen:u.pen, type:'skill'}); });
        break;
      }
      case 'burst': {
        const tg = u.target && u.target.alive ? u.target : this._nearestFoe(u);
        if (tg){ this.damage(tg, u.atk * P, {src:u, pen:u.pen, type:'skill', crit:true}); tg.stun = Math.max(tg.stun, .5); }
        break;
      }
      case 'snipe': {
        let tg = foes.slice().sort((a, b) => b.maxHp - a.maxHp)[0];
        if (u.target && u.target.alive) tg = u.target;
        if (tg){ ev.tx = tg.x; ev.ty = tg.y; this.damage(tg, u.atk * P, {src:u, pen:u.pen, type:'skill', crit:true}); tg.x += (tg.x - u.x) * .12; }
        break;
      }
      case 'dash': {
        const tg = foes.slice().sort((a, b) => Math.hypot(b.x - u.x, b.y - u.y) - Math.hypot(a.x - u.x, a.y - u.y))[0];
        if (tg){
          ev.tx = tg.x; ev.ty = tg.y;
          const dx = tg.x - u.x, dy = tg.y - u.y, d = Math.hypot(dx, dy) || 1;
          foes.forEach(f => { if (Math.hypot(f.x - u.x, f.y - u.y) < d) this.damage(f, u.atk * P * .8, {src:u, pen:u.pen, type:'skill'}); });
          u.x = tg.x - dx / d * this.cell * .9; u.y = tg.y - dy / d * this.cell * .9;
          u.atkBuffT = 3; u.atkBuffV = .5;
          if (tg.alive) this.damage(tg, u.atk * P * .5, {src:u, pen:u.pen, type:'skill'});
        }
        break;
      }
      case 'cc': {
        foes.forEach(f => { if (Math.hypot(f.x - u.x, f.y - u.y) < R + 28){ this.damage(f, u.atk * P * .6, {src:u, pen:u.pen, type:'skill'}); f.stun = Math.max(f.stun, 1.4); } });
        break;
      }
      case 'dot': {
        const tg = u.target && u.target.alive ? u.target : this._nearestFoe(u);
        if (tg){ tg.dotT = 4; tg.dotV = u.atk * P * .22; tg.dotSrc = u; tg.penDebuff = Math.min(.5, (tg.penDebuff || 0) + .2); tg.penDebuffT = 4; }
        break;
      }
      case 'buff': {
        const def = u.def.role === 'df';
        this.alliesOf(u).forEach(f => {
          if (!f.alive || Math.hypot(f.x - u.x, f.y - u.y) > this.cell * 2.2) return;
          if (def){ f.armor += 30 * P; f.mr += 30 * P; } else { f.atkBuffT = 6; f.atkBuffV = Math.max(f.atkBuffV, P); f.as *= 1.3; }
        });
        this.events.push({t:'skill', x:u.x, y:u.y, r:this.cell * 2.2, name:u.def.quote, kind:'buff', side:u.side});
        break;
      }
      case 'shield': {
        const v = u.skillP * u.sp.v;
        this.alliesOf(u).forEach(f => { if (f.alive) f.shield += v; });
        break;
      }
      case 'heal': {
        this.alliesOf(u).forEach(f => { if (f.alive && Math.hypot(f.x - u.x, f.y - u.y) < (u.skillR || 60) + 14) this.heal(f, u.maxHp * .14 * P, true); });
        break;
      }
    }
  }
  heal(u, v, fx){
    if (!u.alive) return;
    const before = u.hp;
    u.hp = Math.min(u.maxHp, u.hp + v);
    if (fx && u.hp > before) this.events.push({t:'heal', x:u.x, y:u.y, v:Math.round(u.hp - before), side:u.side});
  }
  damage(tg, raw, opt){
    opt = opt || {};
    if (!tg.alive || raw <= 0) return;
    let dmg = raw;
    if (!opt.true){
      const ar = Math.max(0, tg.armor * (1 - (opt.pen || 0)) * (1 - (tg.penDebuffT > 0 ? tg.penDebuff : 0)));
      const mr = Math.max(0, tg.mr * (1 - (opt.pen || 0)));
      const isSpell = opt.type === 'skill' || opt.type === 'dot';
      const res = isSpell ? mr : ar;
      dmg = raw * 100 / (100 + res);
    }
    dmg *= (1 - (tg.dr || 0));
    /* 护盾先扣 */
    if (tg.shield > 0){
      const s = Math.min(tg.shield, dmg);
      tg.shield -= s; dmg -= s;
      this.events.push({t:'shieldHit', x:tg.x, y:tg.y, v:Math.round(s), side:tg.side});
    }
    if (dmg <= 0) return;
    tg.hp -= dmg;
    tg.hitFlash = .15;
    if (!opt.silent) this.events.push({t:'hit', x:tg.x, y:tg.y, v:Math.round(dmg), crit:!!opt.crit, side:tg.side, src:opt.src && opt.src.side});
    if (opt.src && (opt.src.reflect || (this.ctx.augs || []).includes('a9'))){
      const rf = (opt.src.reflect || 0) + ((this.ctx.augs || []).includes('a9') ? .25 : 0);
      if (rf > 0 && opt.type !== 'dot') this.damage(opt.src, dmg * rf, {type:'dot', silent:true});
    }
    if (tg.hp <= 0) this._die(tg, opt.src);
  }
  _die(u, src){
    u.alive = false; u.hp = 0; u.shield = 0;
    this.events.push({t:'die', x:u.x, y:u.y, side:u.side, id:u.id});
    if ((this.ctx.augs || []).includes('a7')){
      this.revives = (this.revives || 0) + 1;
      if (this.revives <= 3) this.alliesOf(u).forEach(f => { if (f.alive) f.atk *= 1.12; });
    }
  }
  _checkEnd(){
    if (this.over) return;
    const a0 = this.aliveOf(0).length, a1 = this.aliveOf(1).length;
    if (a0 === 0 || a1 === 0){
      this.over = true;
      this.winner = a0 > a1 ? 0 : a1 > a0 ? 1 : -1;
      return;
    }
    if (this.t >= 50){
      this.over = true;
      const pa = this.a.reduce((s, u) => s + (u.alive ? u.hp / u.maxHp : 0), 0);
      const pb = this.b.reduce((s, u) => s + (u.alive ? u.hp / u.maxHp : 0), 0);
      this.winner = pa >= pb ? 0 : 1;
      this.events.push({t:'timeup'});
    }
  }
}

/* ============================================================
   游戏状态机（纯逻辑）
   ============================================================ */
const FOE_NAMES = ['疾风梯队','钢铁洪流','桑巴军团','银河战舰','红魔青年军','郁金香风暴','蓝衣铁壁','高卢雄鸡','三狮冲锋','探戈舞者','北欧战车','斗牛士方阵'];
const BENCH_MAX = 10;
const MAX_STAGE = 15;

const G = {
  phase:'menu',            // menu | prep | battle | aug | over
  stage:1, gold:10, hp:START_HP, level:2, exp:0,
  shop:[], bench:[], board:[], foe:[], foeName:'', foeDesc:'',
  items:{},                // key -> count
  streak:0, winStreak:0, loseStreak:0,
  augs:[], augChoices:[], result:null,
  bt:null, cell:64,
  uidSeq:1, rng:mulberry32(777),
  log:[],
};

function uid(){ return G.uidSeq++; }
function cardNew(id, star){ return {uid:uid(), id, star:star || 1, items:[]}; }
function findCard(u){ return G.bench.find(c => c.uid === u) || G.board.find(c => c.uid === u) || null; }
function allCards(){ return G.bench.concat(G.board); }
function popLimit(){ return Math.min(COLS * ROWS / 2, G.level + (G.augs.includes('a2') ? 1 : 0)); }

function newGame(){
  G.phase = 'prep'; G.stage = 1; G.gold = 10; G.hp = START_HP; G.level = 2; G.exp = 0;
  G.shop = []; G.bench = []; G.board = []; G.items = {};
  G.streak = 0; G.winStreak = 0; G.loseStreak = 0;
  G.augs = []; G.augChoices = []; G.result = null; G.bt = null;
  /* 初始 3 张 1 费 */
  const pool1 = UNITS.filter(u => u.cost === 1);
  for (let i = 0; i < 3; i++) G.bench.push(cardNew(pick(pool1).id));
  refreshShop(true);
  genFoe();
}

/* ---------- 商店 ---------- */
function rollCost(){
  const r = G.rng();
  const p5 = G.augs.includes('a11') ? COST_P[5] * 3 : COST_P[5];
  let acc = 0;
  const table = [[1, COST_P[1]], [2, COST_P[2]], [3, COST_P[3]], [4, COST_P[4]], [5, p5]];
  for (const pair of table){ acc += pair[1]; if (r < acc) return pair[0]; }
  return 1;
}
function rollShop(){
  const list = [];
  for (let i = 0; i < SHOP_SIZE; i++){
    const cost = rollCost();
    let pool = UNITS.filter(u => u.cost === cost);
    if (!pool.length) pool = UNITS.filter(u => u.cost === 1);
    list.push({uid:uid(), id:pick(pool).id, cost, bought:false});
  }
  /* 保底：至少 1 张可负担的 1~2 费 */
  if (!list.some(c => c.cost <= 2)) list[4].cost = 1, list[4].id = pick(UNITS.filter(u => u.cost === 1)).id;
  return list;
}
function refreshShop(free){
  if (!free){
    if (G.gold < 2) return {ok:false, msg:'金币不足'};
    G.gold -= 2;
  }
  G.shop = rollShop();
  return {ok:true};
}
function buyShop(idx){
  const c = G.shop[idx];
  if (!c || c.bought) return {ok:false, msg:'已购买'};
  if (G.gold < c.cost) return {ok:false, msg:'金币不足'};
  if (G.bench.length >= BENCH_MAX) return {ok:false, msg:'备战区已满'};
  G.gold -= c.cost; c.bought = true;
  const card = cardNew(c.id);
  G.bench.push(card);
  const merged = checkMerge();
  return {ok:true, card, merged};
}
function sellCard(u){
  const isBoard = G.board.some(c => c.uid === u);
  const arr = isBoard ? G.board : G.bench;
  const i = arr.findIndex(c => c.uid === u);
  if (i < 0) return {ok:false, msg:'找不到单位'};
  const card = arr[i];
  const back = Math.floor(U_BY_ID[card.id].cost * [1, 1.8, 5.4][card.star - 1]);
  G.gold += back;
  card.items.forEach(k => giveItem(k, 1));
  arr.splice(i, 1);
  return {ok:true, gold:back};
}
function buyExp(){
  if (G.gold < 4) return {ok:false, msg:'金币不足'};
  if (G.level >= MAX_LV) return {ok:false, msg:'已满级'};
  G.gold -= 4;
  addExp(4 * (G.augs.includes('a12') ? 1.6 : 1));
  return {ok:true};
}
function addExp(v){
  if (G.level >= MAX_LV) return;
  const before = G.level;
  G.exp += v;
  while (G.level < MAX_LV && G.exp >= EXP_TABLE[G.level]){
    G.exp -= EXP_TABLE[G.level];
    G.level++;
  }
  if (G.level > before && G.phase === 'prep'){
    AudioFX.star();
    banner('人口升级', `上场名额 ${G.level}`, '快去商店补强阵容');
  }
}

/* ---------- 布阵 ---------- */
function placeCard(u, col, row){
  if (col > COLS / 2 - 1) return {ok:false, msg:'只能放在自家半场'};
  const card = findCard(u);
  if (!card) return {ok:false, msg:'找不到单位'};
  const bi = G.bench.findIndex(c => c.uid === u);
  const oi = G.board.findIndex(c => c.uid === u);
  const occupant = G.board.find(c => c.col === col && c.row === row);
  if (occupant){
    if (occupant.uid === u) return {ok:true};
    if (oi >= 0){
      /* 场上交换 */
      occupant.col = card.col; occupant.row = card.row;
      card.col = col; card.row = row;
      return {ok:true};
    }
    /* bench 替换：原单位回备战区 */
    G.board.splice(G.board.indexOf(occupant), 1);
    G.bench.push(occupant);
  }
  if (oi >= 0){ card.col = col; card.row = row; return {ok:true}; }
  if (bi < 0) return {ok:false, msg:'找不到单位'};
  if (G.board.length >= popLimit()) return {ok:false, msg:'人口已满（升级或买经验解锁）'};
  G.bench.splice(bi, 1);
  card.col = col; card.row = row;
  G.board.push(card);
  return {ok:true};
}
function benchCard(u){
  const i = G.board.findIndex(c => c.uid === u);
  if (i < 0) return {ok:false};
  if (G.bench.length >= BENCH_MAX) return {ok:false, msg:'备战区已满'};
  const card = G.board[i];
  G.board.splice(i, 1);
  G.bench.push(card);
  return {ok:true};
}

/* ---------- 合成 ---------- */
function checkMerge(){
  const out = [];
  let go = true;
  while (go){
    go = false;
    const groups = {};
    allCards().forEach(c => { const k = c.id + ':' + c.star; (groups[k] = groups[k] || []).push(c); });
    for (const k in groups){
      const g = groups[k];
      if (g.length >= 3){
        const trio = g.slice(0, 3);
        const pos = trio.find(c => G.board.includes(c));
        const newCard = {uid:uid(), id:trio[0].id, star:trio[0].star + 1, items:[]};
        trio.forEach(c => {
          const bi = G.bench.indexOf(c); if (bi >= 0) G.bench.splice(bi, 1);
          const oi = G.board.indexOf(c); if (oi >= 0) G.board.splice(oi, 1);
          c.items.forEach(it => { if (newCard.items.length < 3) newCard.items.push(it); else giveItem(it, 1); });
        });
        if (pos){ newCard.col = pos.col; newCard.row = pos.row; G.board.push(newCard); }
        else G.bench.push(newCard);
        out.push({id:newCard.id, star:newCard.star});
        go = true;
        break;
      }
    }
  }
  return out;
}

/* ---------- 装备 ---------- */
function giveItem(key, n){ G.items[key] = (G.items[key] || 0) + (n || 1); }
function takeItem(key){
  if (!G.items[key]) return false;
  G.items[key]--; if (!G.items[key]) delete G.items[key];
  return true;
}
function tryMergeItems(k1, k2){
  if (k1 === k2) return {ok:false, msg:'需要两件不同的散件'};
  if (isBig(k1) || isBig(k2)) return {ok:false, msg:'大件无法再合成'};
  const big = itemKeyOf(k1, k2);
  if (!BIG_ITEMS[big]) return {ok:false, msg:'合成失败'};
  if (!G.items[k1] || !G.items[k2]) return {ok:false, msg:'材料不足'};
  takeItem(k1); takeItem(k2); giveItem(big);
  return {ok:true, big};
}
function attachItem(key, u){
  if (!G.items[key]) return {ok:false, msg:'仓库中没有该装备'};
  const card = findCard(u);
  if (!card) return {ok:false, msg:'找不到单位'};
  if (card.items.length >= 3) return {ok:false, msg:'该球星已装备 3 件'};
  takeItem(key); card.items.push(key);
  return {ok:true};
}

/* ---------- AI 阵容 ---------- */
function genFoe(){
  const st = G.stage;
  const pop = Math.min(9, 2 + Math.floor((st - 1) / 1.4));
  const maxCost = Math.min(5, 1 + Math.floor((st - 1) / 2.6));
  const star2 = st >= 6 ? Math.floor(pop / 3) : 0;
  const list = [];
  for (let i = 0; i < pop; i++){
    let cost = 1 + Math.floor(G.rng() * maxCost);
    let pool = UNITS.filter(u => u.cost === cost);
    if (!pool.length) pool = UNITS.filter(u => u.cost === 1);
    const def = pick(pool);
    const star = i < star2 ? 2 : 1;
    const items = [];
    if (st >= 5) items.push(pick(Object.keys(BASE_ITEMS)));
    if (st >= 9 && G.rng() < .5){
      const keys = Object.keys(BASE_ITEMS);
      items.length = 0; items.push(itemKeyOf(pick(keys), pick(keys)));
    }
    list.push({def, star, items, col: 3 + (i % 3), row: Math.floor(i / 3) % 3});
  }
  G.foe = list;
  G.foeName = FOE_NAMES[(st - 1) % FOE_NAMES.length];
  const totalStar = list.reduce((s, c) => s + c.star, 0);
  /* foe 激活羁绊展示 */
  const cnt = countTraits(list.map(c => ({def: c.def})));
  const active = [];
  Object.keys(cnt.trait).forEach(k => { if (traitTier(cnt.trait[k], TRAITS[k].lv) >= 0) active.push(TRAITS[k].name); });
  Object.keys(cnt.role).forEach(k => { if (traitTier(cnt.role[k], ROLES[k].lv) >= 0) active.push(ROLES[k].name); });
  G.foeDesc = `${pop} 人口 · ${list.filter(c => c.star > 1).length} 位多星 · 战力 ${pop * 10 + totalStar * 6}${active.length ? ' · ' + active.slice(0, 3).join('/') : ''}`;
}

/* ---------- 战斗与回合 ---------- */
function startBattle(){
  if (!G.board.length) return {ok:false, msg:'至少需要上场 1 名球星'};
  G.phase = 'battle';
  const pa = G.board.map(c => makeUnit(c, 0, c.col, c.row, G.cell));
  const pb = G.foe.map(c => makeUnit({def:c.def, star:c.star, items:c.items}, 1, c.col, c.row, G.cell));
  G.bt = new Battle(pa, pb, {cell:G.cell, augs:G.augs.slice()});
  return {ok:true};
}
function income(){
  let v = 5 + Math.min(5, Math.floor(G.gold / 10));
  if (G.winStreak >= 2) v += Math.min(3, G.winStreak - 1);
  if (G.loseStreak >= 2) v += Math.min(3, G.loseStreak - 1);
  if (G.augs.includes('a1')) v += 3;
  return v;
}
function endBattle(){
  const bt = G.bt;
  const win = bt && bt.winner === 0;
  const foeAlive = bt ? bt.aliveOf(1).length : 0;
  if (win){ G.winStreak++; G.loseStreak = 0; } else { G.loseStreak++; G.winStreak = 0; }
  const inc = income();
  G.gold += inc;
  const dmg = win ? 0 : (5 + foeAlive * 2 + Math.floor(G.stage / 2));
  G.hp -= dmg;
  const merged = checkMerge();
  addExp(2 * (G.augs.includes('a12') ? 1.6 : 1));
  const loot = [];
  if (win && G.stage % 5 === 0){
    const keys = Object.keys(BASE_ITEMS);
    for (let i = 0; i < 2; i++){ const k = pick(keys); giveItem(k, 1); loot.push(BASE_ITEMS[k].name); }
  }
  G.result = {win, dmg, inc, foeAlive, loot};
  G.stage++;
  if (G.hp <= 0){ G.hp = 0; G.phase = 'over'; G.result.lose = true; return G.result; }
  if (G.stage > MAX_STAGE){ G.phase = 'over'; G.result.champion = true; return G.result; }
  if (G.stage % 3 === 2) rollAugs();
  G.phase = 'prep';
  refreshShop(true);
  genFoe();
  return G.result;
}
function rollAugs(){
  const pool = AUGMENTS.filter(a => !G.augs.includes(a.id));
  const three = [];
  const cp = pool.slice();
  for (let i = 0; i < 3 && cp.length; i++) three.push(cp.splice(Math.floor(G.rng() * cp.length), 1)[0]);
  G.augChoices = three;
  G.phase = 'aug';
}
function pickAug(id){
  const a = G.augChoices.find(x => x.id === id);
  if (!a) return {ok:false};
  G.augs.push(id);
  G.augChoices = [];
  G.phase = 'prep';
  refreshShop(true);
  genFoe();
  return {ok:true, aug:a};
}

  ctx:null, on:true,
  ensure(){
    if (!this.on) return;
    if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(f, dur, type, vol, delay){
    if (!this.on) return;
    this.ensure();
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(vol || .1, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + (dur || .12));
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0 + (dur || .12) + .02);
    } catch (e) { this.on = false; }
  },
  click(){ this.play(640, .05, 'triangle', .05); },
  coin(){ this.play(880, .07, 'triangle', .07); this.play(1320, .09, 'triangle', .05, .05); },
  place(){ this.play(420, .09, 'triangle', .09); this.play(630, .12, 'triangle', .08, .07); },
  star(){ [523, 659, 784, 1046].forEach((f, i) => this.play(f, .16, 'triangle', .09, i * .07)); },
  skill(){ this.play(150, .26, 'sawtooth', .05); this.play(300, .2, 'square', .035, .03); },
  win(){ [523, 659, 784, 1046].forEach((f, i) => this.play(f, .22, 'triangle', .1, i * .13)); },
  lose(){ [392, 311, 262].forEach((f, i) => this.play(f, .26, 'sine', .09, i * .16)); },
};

/* ---------- 飞牌动画 ---------- */
function flyCard(fromEl, toEl, html){
  if (!fromEl || !toEl) return;
  const f = fromEl.getBoundingClientRect(), t = toEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'flyCard';
  el.innerHTML = html;
  el.style.left = f.left + 'px'; el.style.top = f.top + 'px';
  el.style.width = f.width + 'px'; el.style.height = f.height + 'px';
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.transform = `translate(${t.left - f.left}px, ${t.top - f.top}px) scale(.8)`;
    el.style.opacity = '.85';
  });
  setTimeout(() => el.remove(), 420);
}

/* ---------- 球星 Q 版头像（canvas 程序化生成） ---------- */
const avatarCache = {};
function shadeHex(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0){ r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r|0},${g|0},${b|0})`;
}
function starPath(g, cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const rad = i % 2 === 0 ? r : r * .45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function avatar(def, star, size){
  const key = def.id + ':' + star + ':' + size;
  if (avatarCache[key]) return avatarCache[key];
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const S = size / 64;
  /* 背景：球衣色径向渐变（上亮下暗） */
  const bg = g.createRadialGradient(size*.5, size*.3, size*.05, size*.5, size*.55, size*.85);
  bg.addColorStop(0, shadeHex(def.jc, .35));
  bg.addColorStop(.55, def.jc);
  bg.addColorStop(1, shadeHex(def.jc, -.35));
  g.fillStyle = bg; g.fillRect(0, 0, size, size);
  g.fillStyle = 'rgba(255,255,255,.14)';
  g.beginPath(); g.arc(size * .5, size * .78, size * .42, 0, 7); g.fill();
  /* 球衣 */
  g.fillStyle = def.jc;
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1 * S;
  g.beginPath();
  g.moveTo(14 * S, 64 * S); g.lineTo(18 * S, 46 * S); g.lineTo(46 * S, 46 * S); g.lineTo(50 * S, 64 * S);
  g.closePath(); g.fill(); g.stroke();
  /* 脖子 */
  g.fillStyle = def.skin;
  g.fillRect(27 * S, 40 * S, 10 * S, 8 * S);
  /* 脸 */
  g.beginPath(); g.arc(32 * S, 30 * S, 15 * S, 0, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.stroke();
  /* 头发 */
  g.fillStyle = def.hair;
  const st = def.style;
  if (st === 'afro'){ g.beginPath(); g.arc(32 * S, 26 * S, 17 * S, Math.PI * 1.02, Math.PI * 2.08); g.fill(); }
  else if (st === 'bald'){ /* 无 */ }
  else if (st === 'long'){ g.beginPath(); g.arc(32 * S, 27 * S, 16.5 * S, Math.PI * .96, Math.PI * 2.04); g.fill();
    g.beginPath(); g.ellipse(32 * S, 34 * S, 16 * S, 12 * S, 0, Math.PI * .12, Math.PI * .88); g.fill(); }
  else if (st === 'curly'){ for (let i = 0; i < 7; i++){ g.beginPath(); g.arc((22 + i * 3.4) * S, (21 + (i % 2) * 3) * S, 3.4 * S, 0, 7); g.fill(); } }
  else { g.beginPath(); g.arc(32 * S, 26 * S, 15.5 * S, Math.PI * .98, Math.PI * 2.02); g.fill(); }
  /* 眼睛 */
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(26 * S, 30 * S, 3.1 * S, 0, 7); g.arc(38 * S, 30 * S, 3.1 * S, 0, 7); g.fill();
  g.fillStyle = '#222';
  g.beginPath(); g.arc(26.6 * S, 30.4 * S, 1.5 * S, 0, 7); g.arc(38.6 * S, 30.4 * S, 1.5 * S, 0, 7); g.fill();
  /* 嘴 */
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1.2 * S;
  g.beginPath(); g.arc(32 * S, 34 * S, 4 * S, .25 * Math.PI, .75 * Math.PI); g.stroke();
  /* 号码 */
  g.fillStyle = 'rgba(255,255,255,.92)';
  g.font = `700 ${13 * S}px sans-serif`; g.textAlign = 'center';
  g.fillText(String(def.num), 32 * S, 60 * S);
  /* 星星（五角星） */
  if (star > 1){
    for (let i = 0; i < star - 1; i++){
      const sx = size - (8 + i * 10) * S, sy = 8 * S;
      g.fillStyle = 'rgba(0,0,0,.35)';
      starPath(g, sx, sy + .8 * S, 3.8 * S); g.fill();
      g.fillStyle = '#ffd76a';
      starPath(g, sx, sy, 3.8 * S); g.fill();
    }
  }
  /* 四角暗角增质感 */
  const vg = g.createRadialGradient(size*.5, size*.5, size*.3, size*.5, size*.5, size*.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.22)');
  g.fillStyle = vg; g.fillRect(0, 0, size, size);
  avatarCache[key] = cv;
  return cv;
}

/* ---------- 布局 ---------- */
function layout(){
  const wrap = $('arenaWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cv = $('arena');
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cell = Math.max(26, Math.min(w / ((COLS + .7) * Math.sqrt(3)), h / (ROWS * 1.5 + .9)));
  G.cell = cell;
  ui.w = w; ui.h = h;
}

/* ---------- 商店 ---------- */
function costColor(c){ return ['', 'var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'][c]; }
function hexEl(card, cls){
  const def = U_BY_ID[card.id];
  const el = document.createElement('div');
  el.className = 'hex ' + (cls || '');
  el.dataset.uid = card.uid;
  el.style.background = costColor(def.cost);
  if (def.cost >= 4){
    el.classList.add('glow');
    el.style.setProperty('--gc', costColor(def.cost));
    if (def.cost === 5) el.classList.add('leg');
  }
  const face = document.createElement('div');
  face.className = 'face';
  const av = avatar(def, card.star, 56);
  const img = new Image();
  img.src = av.toDataURL();
  img.draggable = false;
  img.style.cssText = 'width:100%;height:100%;display:block';
  face.appendChild(img);
  el.appendChild(face);
  const cost = document.createElement('span');
  cost.className = 'cost'; cost.textContent = def.cost;
  el.appendChild(cost);
  if (card.star > 1){
    const st = document.createElement('span');
    st.className = 'star'; st.textContent = '★'.repeat(card.star);
    el.appendChild(st);
  }
  if (card.items && card.items.length){
    const it = document.createElement('div');
    it.className = 'itm';
    card.items.forEach(k => {
      const i = document.createElement('i');
      i.style.background = isBig(k) ? '#e0952a' : '#8a8779';
      it.appendChild(i);
    });
    el.appendChild(it);
  }
  return el;
}
function renderShop(){
  const box = $('shopList');
  box.textContent = '';
  G.shop.forEach((c, i) => {
    const def = U_BY_ID[c.id];
    const el = document.createElement('div');
    el.className = 'shopItem' + (c.bought ? ' bought' : '');
    el.dataset.uid = c.uid; el.dataset.idx = i;
    el.style.setProperty('--rc', costColor(def.cost));
    if (def.cost === 5) el.classList.add('leg5');
    if (!c.bought && G.gold < def.cost) el.classList.add('locked');
    const av = avatar(def, 1, 40);
    const img = new Image(); img.src = av.toDataURL();
    img.draggable = false;
    img.style.cssText = 'width:38px;height:38px;border-radius:8px;flex:0 0 auto';
    el.appendChild(img);
    const nm = document.createElement('div');
    nm.className = 'nm';
    nm.innerHTML = `<b>${def.name}</b><span>${NATIONS[def.na]} · ${ROLES[def.role].name}</span>`;
    el.appendChild(nm);
    const buy = document.createElement('button');
    buy.className = 'buy'; buy.textContent = c.cost;
    el.appendChild(buy);
    el.addEventListener('click', () => {
      const r = buyShop(i);
      if (!r.ok) toast(r.msg);
      else {
        AudioFX.coin();
        /* 飞牌动画：商店卡 → 备战区 */
        const slots = $('board').querySelectorAll('.slot');
        flyCard(el, slots[0] || $('board'), el.innerHTML);
        if (r.merged && r.merged.length){
          const m = r.merged[0];
          AudioFX.star();
          banner('合成成功', `${m.star} 星 ${U_BY_ID[m.id].name}`, '属性大幅提升');
        }
        sync();
      }
    });
    box.appendChild(el);
  });
}

/* ---------- 备战区 ---------- */
function renderBench(){
  const box = $('board');
  box.textContent = '';
  const cards = allCards();
  G.bench.forEach(c => {
    const el = hexEl(c, 'owned');
    /* 可合成闪烁：场上+备战已有 2 个同名同星 */
    const n = cards.filter(x => x.id === c.id && x.star === c.star).length;
    if (n >= 2) el.classList.add('canMerge');
    box.appendChild(el);
  });
  /* 手机窄屏只显示有卡位 + 3 个空位，避免横向溢出 */
  const showSlots = window.innerWidth < 1080 ? Math.min(BENCH_MAX, G.bench.length + 3) : BENCH_MAX;
  for (let i = G.bench.length; i < showSlots; i++){
    const s = document.createElement('div');
    s.className = 'slot';
    box.appendChild(s);
  }
}

/* ---------- 羁绊 ---------- */
function renderTraits(){
  const box = $('traitList');
  box.textContent = '';
  const cards = allCards().map(c => ({def: U_BY_ID[c.id], star: c.star}));
  const cnt = countTraits(cards);
  const rows = [];
  Object.keys(TRAITS).forEach(k => rows.push([TRAITS[k], cnt.trait[k] || 0, 'trait']));
  Object.keys(ROLES).forEach(k => rows.push([ROLES[k], cnt.role[k] || 0, 'role']));
  rows.forEach(([info, n]) => {
    const tier = traitTier(n, info.lv);
    const el = document.createElement('div');
    el.className = 'traitChip' + (tier >= 0 ? ' on' : '');
    if (tier >= 0) el.style.background = info.color;
    const nxt = info.lv[tier + 1];
    el.innerHTML = `<span>${info.name}</span><span class="n">${n}</span><span class="dots">${info.lv.map(l => n >= l ? '●' : '○').join('')}</span>` + (tier >= 0 && nxt ? `<span style="opacity:.8">/${nxt}</span>` : '');
    if (tier >= 0) el.title = info.desc + '（已激活）';
    box.appendChild(el);
  });
}

/* ---------- 装备仓库 ---------- */
function renderItems(){
  const box = $('itemGrid');
  box.textContent = '';
  const keys = Object.keys(G.items);
  const slots = 9;
  for (let i = 0; i < slots; i++){
    const k = keys[i];
    const el = document.createElement('div');
    if (k){
      const it = isBig(k) ? BIG_ITEMS[k] : BASE_ITEMS[k];
      el.className = 'itemCell';
      el.dataset.key = k;
      el.textContent = it.ic;
      const cnt = document.createElement('span');
      cnt.className = 'cnt'; cnt.textContent = G.items[k];
      el.appendChild(cnt);
    } else {
      el.className = 'itemCell empty';
      el.textContent = '+';
    }
    box.appendChild(el);
  }
}
